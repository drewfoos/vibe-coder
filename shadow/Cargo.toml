[package]
name = "shadow"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
windows = { version = "0.56.0", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
]}
once_cell = "1.19.0"
# Added for HTTP requests
reqwest = { version = "0.12.4", features = ["blocking", "json"] } # Using blocking for simplicity for now
# Added for image encoding
image = { version = "0.25.1", default-features = false, features = ["png"] } # Only need PNG support
# Added for Base64 encoding
base64 = "0.22.1"
# Added for JSON serialization (optional, but good practice)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Added for async runtime if needed later (reqwest async needs one)
# tokio = { version = "1", features = ["full"] } # Keep commented out for now

